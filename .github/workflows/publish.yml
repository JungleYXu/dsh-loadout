name: publish

# Publishing lives here rather than in a local shell so the artifact is built
# from a clean checkout at a tagged commit, and so nobody needs a registry
# password on their laptop. Enable it by adding an NPM_TOKEN repository secret:
# a granular token for the package owner with Read and write permission on
# this package and Bypass 2FA, because npm no longer issues classic tokens.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      # Without the secret this job would fail on every tag and turn the
      # repository's checks red for a reason that has nothing to do with the
      # code under test. Skip instead, with a visible notice: publishing is
      # opt-in, the tag itself is still valid.
      - name: Check for a publish token
        id: token
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=npm publish skipped::NPM_TOKEN is not configured; nothing was published. Add the repository secret to enable it."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # v0.12.5 failed here with TLOG_CREATE_ENTRY_ERROR (409): sigstore's
      # transparency log already held an equivalent entry, so npm exited non-zero
      # even though the registry had not accepted the version. Two fallbacks keep
      # a single bad tlog entry from blocking a release: if the version is in fact
      # on the registry, treat it as published; otherwise publish once more
      # without provenance (a different code path, no tlog entry to dedupe).
      - name: npm publish
        if: steps.token.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -u
          version="$(node -p "require('./package.json').version")"
          published() {
            npm view "dsh-loadout@$version" version >/dev/null 2>&1
          }
          if npm publish --access public --provenance; then
            exit 0
          fi
          if published; then
            echo "::notice title=npm publish had an error after registering::$version is on the registry despite the error above."
            exit 0
          fi
          echo "::warning title=retrying without provenance::publish with provenance failed; retrying once without it."
          npm publish --access public
