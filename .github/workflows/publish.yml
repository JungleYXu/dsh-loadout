name: publish

# Publishing lives here rather than in a local shell so the artifact is built
# from a clean checkout at a tagged commit, and so nobody needs a registry
# password on their laptop. Enable it by adding an NPM_TOKEN repository secret
# (an npm automation token for the package owner).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      # Without the secret this job would fail on every tag and turn the
      # repository's checks red for a reason that has nothing to do with the
      # code under test. Skip instead, with a visible notice: publishing is
      # opt-in, the tag itself is still valid.
      - name: Check for a publish token
        id: token
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=npm publish skipped::NPM_TOKEN is not configured; nothing was published. Add the repository secret to enable it."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: npm publish
        if: steps.token.outputs.present == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
